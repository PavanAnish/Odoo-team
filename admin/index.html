<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside>
      <div class="logo"><i>A</i><span class="lb">Admin Panel</span></div>
      <nav id="nv"></nav>
      <div class="promo">
        <b>AI assistant</b>
        <p class="mut" style="margin:6px 0 10px">Spot churn risk and late payers before they hurt revenue.</p>
        <button class="btn ai" onclick="ask()">Ask AI</button>
      </div>
      <div class="usr">
        <div class="av">MR</div>
        <span><b>Maya Rao</b><br><small class="mut">Finance lead</small></span>
      </div>
    </aside>
    <main>
      <header>
        <button class="ib mb" aria-label="Menu" onclick="app.classList.toggle('open')">☰</button>
        <button class="ib dsk" aria-label="Collapse sidebar" onclick="app.classList.toggle('col')">⇤</button>
        <button class="ask" onclick="ask()">Search or ask AI anything… <b>⌘K</b></button>
        <select class="dsk" style="width:auto" aria-label="Date range">
          <option>Last 30 days</option>
          <option>This quarter</option>
          <option>This year</option>
        </select>
        <button class="ib" aria-label="Notifications" onclick="toast('You have 3 new alerts')">🔔</button>
        <div class="av">MR</div>
      </header>
      <div id="mn"></div>
    </main>
  </div>
  <div id="ts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
